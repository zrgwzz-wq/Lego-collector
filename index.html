<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>LEGO Collector v8</title><style>body{font-family:system-ui;background:#111;color:#eee;max-width:850px;margin:auto;padding:18px}.c{background:#202024;padding:15px;border-radius:16px;margin:10px 0}input,select,button{padding:11px;border-radius:10px;border:1px solid #444;background:#29292e;color:white}button{background:#e3000b;font-weight:bold}img{width:110px;height:90px;object-fit:contain;background:white;border-radius:10px}.p{display:flex;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#999;font-size:12px}</style><h2>🧱 LEGO Collector v8</h2><div class=c id=status>서버 확인 중…</div><div class=c><input id=q placeholder="세트번호/제품명"><button onclick=go()>검색</button></div><div id=res></div><h3>대시보드</h3><div class=grid><div class=c>보유수량<br><b id=cnt>0개</b></div><div class=c>총 구매금액<br><b id=buy>₩0</b></div><div class=c>평가금액<br><b id=val>₩0</b></div><div class=c>평가손익<br><b id=pl>₩0</b></div></div><h3>내 컬렉션</h3><div id=col></div><script>
let db=JSON.parse(localStorage.getItem("legov8")||"{}"),won=n=>"₩"+Math.round(+n||0).toLocaleString();
fetch("/api/health").then(r=>r.json()).then(d=>status.textContent=d.key_configured?"● Brickset API 연결됨":"● API Key 미설정");
async function go(){let d=await fetch("/api/search?q="+encodeURIComponent(q.value)).then(r=>r.json());res.innerHTML=(d.sets||[]).map(s=>`<div class="c p"><img src="${s.image?.thumbnailURL||s.image?.imageURL||""}"><div><b>${s.number} ${s.name}</b><div class=muted>${s.year||""} · ${s.theme||""} · ${s.pieces||0} pcs</div><div class=muted>Brickset 해외 정가: ${s.LEGOCom?.US?.retailPrice? "$"+s.LEGOCom.US.retailPrice+" (US 기준)":"없음"}</div><button onclick='add(${JSON.stringify(JSON.stringify({number:s.number,name:s.name,year:s.year,image:s.image?.thumbnailURL||s.image?.imageURL||""}))})'>소장 등록</button></div></div>`).join("")}
function add(j){let s=JSON.parse(j);if(!db[s.number])db[s.number]={set:s,u:[]};db[s.number].u.push({condition:"MISB",buy:0,value:0,date:""});save()}
function upd(n,i,k,v){db[n].u[i][k]=(k=="buy"||k=="value")?(+v||0):v;save()}
function del(n,i){db[n].u.splice(i,1);if(!db[n].u.length)delete db[n];save()}
function save(){localStorage.setItem("legov8",JSON.stringify(db));draw()}
function draw(){let all=Object.values(db);col.innerHTML=all.map(x=>`<div class=c><div class=p><img src="${x.set.image}"><div><b>${x.set.number} ${x.set.name}</b><div>보유 ${x.u.length}개</div><button onclick='add(${JSON.stringify(JSON.stringify(x.set))})'>+1개</button></div></div>${x.u.map((u,i)=>`<div class=c>#${i+1} <select onchange="upd('${x.set.number}',${i},'condition',this.value)"><option>MISB</option><option ${u.condition=="NIB"?"selected":""}>NIB</option><option ${u.condition=="중고 Complete"?"selected":""}>중고 Complete</option></select><input placeholder="구매가" value="${u.buy||""}" onchange="upd('${x.set.number}',${i},'buy',this.value)"><input placeholder="현재 평가가" value="${u.value||""}" onchange="upd('${x.set.number}',${i},'value',this.value)"><input type=date value="${u.date||""}" onchange="upd('${x.set.number}',${i},'date',this.value)"><button onclick="del('${x.set.number}',${i})">삭제</button></div>`).join("")}</div>`).join("");let u=all.flatMap(x=>x.u),b=u.reduce((s,x)=>s+(+x.buy||0),0),v=u.reduce((s,x)=>s+(+x.value||0),0);cnt.textContent=u.length+"개";buy.textContent=won(b);val.textContent=won(v);pl.textContent=(v-b>=0?"+":"")+won(v-b)}draw();
</script>
