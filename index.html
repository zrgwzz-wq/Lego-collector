<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGO Collector v7</title>
<style>body{font-family:system-ui;margin:auto;max-width:800px;padding:18px;background:#f5f5f7}.c{background:white;padding:15px;border-radius:16px;margin:10px 0}input,select,button{padding:11px;border-radius:10px;border:1px solid #ddd}input{width:60%}button{background:#e3000b;color:white;font-weight:bold}</style>
<h2>🧱 LEGO Collector v7</h2><div class=c id=status>서버 확인중</div><input id=q placeholder="세트번호/제품명"><button onclick=go()>검색</button><div id=r></div><h3>내 컬렉션</h3><div id=col></div>
<script>
let db=JSON.parse(localStorage.getItem("legov7")||"{}");const save=()=>localStorage.setItem("legov7",JSON.stringify(db));
fetch("/api/health").then(x=>x.json()).then(x=>status.textContent=x.key_configured?"Brickset API 연결 준비 완료":"Render Environment에 BRICKSET_API_KEY를 설정하세요");
async function go(){let d=await fetch("/api/search?q="+encodeURIComponent(q.value)).then(x=>x.json());r.innerHTML=(d.sets||[]).map(s=>`<div class=c><b>${s.number} ${s.name}</b><br>${s.year||""} ${s.theme||""}<br><button onclick='add(${JSON.stringify(JSON.stringify({number:s.number,name:s.name,year:s.year}))})'>등록</button></div>`).join("")}
function add(j){let s=JSON.parse(j);if(!db[s.number])db[s.number]={set:s,units:[]};db[s.number].units.push({condition:"MISB",buy:"",date:"",sell:"",memo:""});save();draw()}
function upd(n,i,k,v){db[n].units[i][k]=v;save()}
function del(n,i){db[n].units.splice(i,1);if(!db[n].units.length)delete db[n];save();draw()}
function draw(){col.innerHTML=Object.values(db).map(x=>`<div class=c><b>${x.set.number} ${x.set.name}</b><p>보유 ${x.units.length}개</p>${x.units.map((u,i)=>`<div><b>#${i+1}</b> <select onchange="upd('${x.set.number}',${i},'condition',this.value)"><option>MISB</option><option ${u.condition=="NIB"?"selected":""}>NIB</option><option ${u.condition=="중고 Complete"?"selected":""}>중고 Complete</option></select> <input placeholder="구매가" value="${u.buy}" onchange="upd('${x.set.number}',${i},'buy',this.value)"> <button onclick="del('${x.set.number}',${i})">삭제</button></div>`).join("<br>")}<br><button onclick='add(${JSON.stringify(JSON.stringify(x.set))})'>+ 1개</button></div>`).join("")}draw();
</script>
