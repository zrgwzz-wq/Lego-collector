name: LEGO catalog sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  sync:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install beautifulsoup4 playwright
          python -m playwright install chromium

      - name: Sync catalog, Korean data, search aliases and KREAM trades
        env:
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: >-
          python catalog_sync.py
          --max-calls 60
          --shop-pages 55
          --instruction-names 80
          --alias-batches 4
          --kream-limit 8
