name: LEGO KREAM check

on:
  workflow_dispatch:
    inputs:
      numbers:
        description: "LEGO set numbers (comma separated, up to 3)"
        required: true
        default: "10305,76218"
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  kream-check:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium

      - name: Check KREAM only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KREAM_SET_NUMBERS: ${{ inputs.numbers }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from html import escape
          from pathlib import Path
          from services.kream import sync_set

          numbers = list(dict.fromkeys(
              n for n in re.split(r"[,\s]+", os.environ["KREAM_SET_NUMBERS"].strip()) if n
          ))
          if not numbers or len(numbers) > 3 or any(not re.fullmatch(r"\d{4,7}", n) for n in numbers):
              raise SystemExit("Enter 1 to 3 LEGO set numbers, separated by commas.")

          failed = False
          results = []
          for number in numbers:
              try:
                  result = sync_set(number, full_history=True, allow_browser=True)
              except Exception as exc:
                  result = {"ok": False, "number": number, "status": "operation_error",
                            "diagnostics": [{"kind": "check_operation", "error": type(exc).__name__}]}
              results.append((number, result))
              print(json.dumps({"kream_check": result}, ensure_ascii=False, indent=2), flush=True)
              failed = failed or not result.get("ok", False)

          def cell(value):
              if value is None:
                  return "확인 불가"
              return escape(str(value)[:450]).replace("|", "&#124;").replace("\r", " ").replace("\n", " ")

          def yes_no(value):
              return "확인 불가" if value is None else "예" if value else "아니오"

          summary = "## KREAM 수집·저장 검사 (Windows)\n\n"
          summary += "새 데이터를 읽지 못한 경우 DB 저장은 확인할 수 없습니다. 기존 데이터 존재와 새 수집 성공은 별도로 표시합니다.\n\n"
          for number, result in results:
              diagnostics = result.get("diagnostics") or []
              observation = next((d for d in reversed(diagnostics) if d.get("kind") == "page_observation"), {})
              page_status = next((d.get("status") for d in reversed(diagnostics)
                                  if d.get("kind") == "product_page" and d.get("status") is not None), None)
              if result.get("storage_succeeded"):
                  stored = "성공"
              elif result.get("refresh_succeeded"):
                  stored = "실패"
              elif result.get("refresh_succeeded") is False:
                  stored = "미확인 (새 데이터 없음)"
              else:
                  stored = "미확인"
              status = result.get("status") or result.get("error") or "unknown"
              labels = {"ok": "수집·저장 성공", "partial_history": "일부 체결 수집·저장",
                        "refresh_failed_cached": "새 수집 실패, 기존 데이터 있음",
                        "refresh_failed": "새 수집 실패", "store_failed": "수집 후 DB 저장 실패",
                        "operation_error": "검사 중 오류"}
              summary += f"### 세트 {number}\n\n| 항목 | 결과 |\n| --- | --- |\n"
              fields = [
                  ("검사 결과", labels.get(status, status)),
                  ("KREAM 상품 번호", result.get("product_id")),
                  ("KREAM 모델 번호", result.get("model_number")),
                  ("이번 수집 체결 / 차트", f"{result.get('fetched_trade_count', 0)}건 / {result.get('fetched_chart_count', 0)}개"),
                  ("기존 포함 저장 체결", result.get("trade_count")),
                  ("이번 DB 저장", stored),
                  ("상품 페이지 HTTP", page_status),
                  ("화면 상태", observation.get("body_state")),
                  ("화면 글자 수", observation.get("body_length")),
                  ("화면에 모델 번호 있음", yes_no(observation.get("product_number_visible"))),
                  ("브라우저 실행 시도", yes_no(result.get("browser_attempted"))),
                  ("화면의 체결 API 관측", yes_no(observation.get("native_sales_observed"))),
                  ("화면의 차트 API 관측", yes_no(observation.get("native_chart_observed"))),
                  ("로그인 안내", yes_no(result.get("login_required"))),
                  ("전체 이력 완료", yes_no(result.get("history_complete"))),
                  ("원본 상태", status),
              ]
              for label, value in fields:
                  summary += f"| {cell(label)} | {cell(value)} |\n"
              summary += "\n**요청·브라우저 진단**\n\n| 단계 | 기록 |\n| --- | --- |\n"
              for diagnostic in diagnostics:
                  details = []
                  if diagnostic.get("status") is not None:
                      details.append("HTTP " + str(diagnostic["status"]))
                  for key in ("error", "reason", "error_body"):
                      if diagnostic.get(key):
                          details.append(str(diagnostic[key]))
                  if details:
                      summary += f"| {cell(diagnostic.get('kind', 'unknown'))} | {cell('; '.join(details))} |\n"
              if not any(d.get("status") is not None or d.get("error") or d.get("reason") or d.get("error_body") for d in diagnostics):
                  summary += "| 진단 기록 | 없음 |\n"
              summary += "\n"
          summary += "전체 이력·차트 완료는 별도 항목입니다. 일부 체결만 저장된 경우 전체 이력 완료는 '아니오'입니다.\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          raise SystemExit(1 if failed else 0)
          PY
