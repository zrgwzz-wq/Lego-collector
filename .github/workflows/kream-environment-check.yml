name: LEGO KREAM environment check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: KREAM check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install requests playwright

      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Compare KREAM access
        env:
          KREAM_CHECK_ENVIRONMENT: ${{ matrix.os }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from services.kream import fetch_sales

          ctx = {
              "number": "10305",
              "model_number": "10305",
              "product_id": 72708,
              "source_url": "https://kream.co.kr/products/72708",
          }
          rows, chart_rows, complete, used_api, used_browser = fetch_sales(
              ctx, full_history=True, allow_browser=True
          )
          diagnostics = ctx.get("diagnostics", [])
          observation = next((d for d in reversed(diagnostics) if d.get("kind") == "page_observation"), {})
          page_status = next((d.get("status") for d in reversed(diagnostics) if d.get("kind") == "product_page"), None)
          received = bool(rows or chart_rows)
          result = {
              "environment": os.environ["KREAM_CHECK_ENVIRONMENT"],
              "data_received": received,
              "trade_count": len(rows),
              "chart_count": len(chart_rows),
              "history_complete": bool(complete and used_api),
              "product_page_status": page_status,
              "body_state": observation.get("body_state", "not_observed"),
              "body_length": observation.get("body_length"),
              "login_required": ctx.get("login_required"),
              "diagnostics": diagnostics,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2), flush=True)
          fields = [
              ("실행 환경", result["environment"]),
              ("새 데이터 수집", "성공" if received else "실패"),
              ("체결 건수", result["trade_count"]),
              ("차트 점수", result["chart_count"]),
              ("전체 이력 완료", "예" if result["history_complete"] else "아니오"),
              ("상품 페이지 HTTP", page_status),
              ("읽힌 화면 상태", result["body_state"]),
              ("읽힌 화면 글자 수", result["body_length"]),
              ("로그인 필요 여부", result["login_required"]),
          ]
          summary = "## KREAM 10305: " + result["environment"] + "\n\n| 항목 | 결과 |\n| --- | --- |\n"
          for name, value in fields:
              summary += f"| {name} | {'확인 불가' if value is None else value} |\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          raise SystemExit(0 if received else 1)
          PYTHON
